name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Build, lint, typecheck, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  integration:
    name: Integration (real playwright run) — playwright ${{ matrix.playwright }}
    runs-on: ${{ matrix.os }}
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        # Validates the `peerDependencies["@playwright/test"]` range (">=1.40.0")
        # empirically rather than by assertion. The range is open-ended, so this
        # matrix can only ever prove the versions that existed when it was last
        # touched — add a leg when Playwright ships a notable minor; the range
        # itself needs no edit.
        #
        # Node varies with the leg because Playwright moved its own floor from
        # Node 18 to Node 20 in 1.62.
        # `os` varies too: `playwright install --with-deps` shells out to a
        # distro-detection script baked into each Playwright release, and
        # 1.40 (Nov 2023) predates the current ubuntu-latest image — it exits
        # 100 on an Ubuntu it has never heard of. Pinning the old leg to the
        # runner it shipped against tests the package rather than Playwright's
        # own installer.
        include:
          - playwright: '1.40.0'
            node: '20'
            os: ubuntu-22.04
          - playwright: '1.50.0'
            node: '20'
            os: ubuntu-latest
          - playwright: '1.62.1'
            node: '22'
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install with matrix Playwright version
        # Deliberately a full, fresh resolution rather than `npm ci` followed by
        # `npm install --no-save @playwright/test@X`. That incremental form
        # trips npm's optional-dependency pruning bug (npm/cli#4828): it
        # silently drops platform-specific binaries (@rollup/rollup-linux-x64-gnu,
        # esbuild's) and the build then dies with a MODULE_NOT_FOUND pointing
        # nowhere near the real cause.
        run: |
          npm pkg set devDependencies.@playwright/test="${{ matrix.playwright }}"
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund
      - run: npm run build
      # Only chromium: the fixture specs are browser-agnostic and one browser
      # is enough to exercise the video/screenshot attachment paths.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration

  example:
    name: Example project (packaged tarball smoke test)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

      # Install the LOCAL build into the example as a real packed tarball
      # rather than linking src/. That exercises package.json's `files` and
      # `exports` maps exactly as a consumer does — the one failure class no
      # local typecheck/lint/test can see, because it exists only in the
      # published artifact. The tarball overrides the example's own registry
      # dependency, so this tests the code in the commit, not what is on npm.
      #
      # Note this rewrites examples/basic/package.json's dependency to a
      # `file:` path. Fine here — the checkout is ephemeral — but running these
      # steps locally will dirty that file; `git checkout examples/` after.
      - name: Pack and install into examples/basic
        run: |
          TARBALL="$(npm pack --silent | tail -1)"
          cd examples/basic
          npm install --no-audit --no-fund "../../$TARBALL"
      - run: npx playwright install --with-deps chromium
        working-directory: examples/basic

      # Run it exactly as examples/basic/README.md tells a user to. Nothing
      # else in CI executes the example project, which is how a sibling
      # package's example silently drifted to documenting a removed option.
      - name: Run the example as its README documents
        working-directory: examples/basic
        run: npm test

      - name: Assert it produced a usable report
        working-directory: examples/basic
        run: |
          node -e '
            const fs = require("node:fs");
            const dir = "qualflare-results";
            if (!fs.existsSync(dir)) throw new Error(`${dir} was never created — the reporter never ran`);
            const reports = fs.readdirSync(dir).filter((f) => f.endsWith(".json"));
            if (reports.length !== 1) throw new Error(`expected 1 report, found ${reports.length}`);
            const payload = JSON.parse(fs.readFileSync(`${dir}/${reports[0]}`, "utf8"));
            if (payload.framework !== "playwright") throw new Error(`framework = ${payload.framework}`);
            if (!payload.metadata) throw new Error("missing top-level metadata — qualflare-cli would mis-detect this file");
            const cases = payload.suites.flatMap((s) => s.cases);
            if (cases.length === 0) throw new Error("report contains no cases");
            console.log(`OK: ${payload.suites.length} suite(s), ${cases.length} case(s)`);
          '
